name: Build Mod JAR

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Project Files
        run: |
          mkdir -p src/main/java/com/ahmad/invtotembind/config
          mkdir -p src/main/java/com/ahmad/invtotembind/util
          mkdir -p src/main/resources/assets/inv_totem_bind/lang

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  maven {
                      name = 'Fabric'
                      url = 'https://maven.fabricmc.net/'
                  }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          rootProject.name = 'inv-totem-bind'
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2G
          org.gradle.parallel=true
          minecraft_version=1.21.11
          yarn_mappings=1.21.11+build.6
          loader_version=0.18.4
          loom_version=1.14.10
          fabric_version=0.141.6+1.21.11
          modmenu_version=17.0.1
          mod_version=1.0.0
          maven_group=com.ahmad.invtotembind
          archives_base_name=inv-totem-bind
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'fabric-loom' version "${loom_version}"
              id 'maven-publish'
          }

          version = "${project.mod_version}+mc${project.minecraft_version}"
          group = project.maven_group

          base {
              archivesName = project.archives_base_name
          }

          repositories {
              mavenCentral()
              maven {
                  name = "TerraformersMC"
                  url = "https://maven.terraformersmc.com/releases/"
              }
          }

          dependencies {
              minecraft "com.mojang:minecraft:${project.minecraft_version}"
              mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
              modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
              modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
              modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
              modLocalRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"
          }

          processResources {
              inputs.property "version", project.version
              filesMatching("fabric.mod.json") {
                  expand "version": inputs.properties.version
              }
          }

          tasks.withType(JavaCompile).configureEach {
              it.options.release = 21
              it.options.encoding = "UTF-8"
          }

          java {
              withSourcesJar()
              sourceCompatibility = JavaVersion.VERSION_21
              targetCompatibility = JavaVersion.VERSION_21
          }
          EOF

          cat << 'EOF' > src/main/resources/fabric.mod.json
          {
            "schemaVersion": 1,
            "id": "inv_totem_bind",
            "version": "${version}",
            "name": "INV Totem Bind",
            "description": "Lightweight Crystal PvP utility mod that swaps a Totem of Undying into the offhand with a single keybind while the inventory screen is open. Credit: Ahmad.",
            "authors": ["Ahmad"],
            "license": "MIT",
            "environment": "client",
            "entrypoints": {
              "client": ["com.ahmad.invtotembind.InvTotemBindClient"],
              "modmenu": ["com.ahmad.invtotembind.config.ModMenuIntegration"]
            },
            "depends": {
              "fabricloader": ">=0.18.1",
              "minecraft": "=1.21.11",
              "java": ">=21",
              "fabric-api": "*"
            },
            "suggests": {
              "modmenu": ">=17.0.0"
            }
          }
          EOF

          cat << 'EOF' > src/main/resources/assets/inv_totem_bind/lang/en_us.json
          {
            "key.category.inv_totem_bind.general": "INV Totem Bind",
            "key.inv_totem_bind.swap_totem": "INV Totem Bind: Swap Totem",
            "text.inv_totem_bind.totem_already_equipped": "Totem Already Equipped",
            "text.inv_totem_bind.no_totem_found": "No Totem Found!",
            "screen.inv_totem_bind.config.title": "INV Totem Bind Settings",
            "screen.inv_totem_bind.config.enabled": "INV Totem Bind: ON",
            "screen.inv_totem_bind.config.disabled": "INV Totem Bind: OFF",
            "screen.inv_totem_bind.config.keybind_info": "Current Keybind: %s",
            "screen.inv_totem_bind.config.keybind_hint": "Change keybind in Options -> Controls -> Key Binds",
            "screen.inv_totem_bind.config.open_controls": "Open Key Binds...",
            "screen.inv_totem_bind.config.credit": "Developed for Minecraft 1.21.11 | Credit: Ahmad"
          }
          EOF

          cat << 'EOF' > src/main/java/com/ahmad/invtotembind/InvTotemBindClient.java
          package com.ahmad.invtotembind;

          import com.ahmad.invtotembind.config.InvTotemConfig;
          import com.ahmad.invtotembind.util.TotemSwapHandler;
          import net.fabricmc.api.ClientModInitializer;
          import net.fabricmc.fabric.api.client.keybinding.v1.KeyBindingHelper;
          import net.fabricmc.fabric.api.client.screen.v1.ScreenEvents;
          import net.fabricmc.fabric.api.client.screen.v1.ScreenKeyboardEvents;
          import net.fabricmc.fabric.api.client.screen.v1.ScreenMouseEvents;
          import net.minecraft.client.gui.screen.ingame.InventoryScreen;
          import net.minecraft.client.option.KeyBinding;
          import net.minecraft.client.util.InputUtil;
          import net.minecraft.util.Identifier;
          import org.lwjgl.glfw.GLFW;
          import org.slf4j.Logger;
          import org.slf4j.LoggerFactory;

          public final class InvTotemBindClient implements ClientModInitializer {
              public static final String MOD_ID = "inv_totem_bind";
              public static final Logger LOGGER = LoggerFactory.getLogger(MOD_ID);

              public static final KeyBinding.Category KEY_CATEGORY = KeyBinding.Category.create(
                      Identifier.of(MOD_ID, "general")
              );

              private static KeyBinding swapTotemKeyBinding;
              private static boolean keyHeldInScreen = false;
              private static long lastActivationTimeMs = 0L;
              private static final long DEBOUNCE_MS = 75L;

              @Override
              public void onInitializeClient() {
                  InvTotemConfig.load();

                  swapTotemKeyBinding = KeyBindingHelper.registerKeyBinding(new KeyBinding(
                          "key.inv_totem_bind.swap_totem",
                          InputUtil.Type.KEYSYM,
                          GLFW.GLFW_KEY_R,
                          KEY_CATEGORY
                  ));

                  ScreenEvents.AFTER_INIT.register((client, screen, scaledWidth, scaledHeight) -> {
                      if (!(screen instanceof InventoryScreen inventoryScreen)) {
                          return;
                      }

                      keyHeldInScreen = false;

                      // Keyboard support (PC & Mobile Launcher custom keys)
                      ScreenKeyboardEvents.beforeKeyPress(inventoryScreen).register((scr, keyInput) -> {
                          if (!InvTotemConfig.isEnabled()) {
                              return;
                          }
                          if (swapTotemKeyBinding == null || swapTotemKeyBinding.isUnbound()) {
                              return;
                          }
                          if (!swapTotemKeyBinding.matchesKey(keyInput)) {
                              return;
                          }

                          if (keyHeldInScreen) {
                              return;
                          }
                          keyHeldInScreen = true;

                          long now = System.currentTimeMillis();
                          if (now - lastActivationTimeMs < DEBOUNCE_MS) {
                              return;
                          }
                          lastActivationTimeMs = now;

                          TotemSwapHandler.trySwapTotem(client, inventoryScreen);
                      });

                      ScreenKeyboardEvents.beforeKeyRelease(inventoryScreen).register((scr, keyInput) -> {
                          if (swapTotemKeyBinding != null && swapTotemKeyBinding.matchesKey(keyInput)) {
                              keyHeldInScreen = false;
                          }
                      });

                      // Mouse button support (if bound to a Mouse button)
                      ScreenMouseEvents.beforeMouseClick(inventoryScreen).register((scr, click) -> {
                          if (!InvTotemConfig.isEnabled()) {
                              return;
                          }
                          if (swapTotemKeyBinding == null || swapTotemKeyBinding.isUnbound()) {
                              return;
                          }
                          if (!swapTotemKeyBinding.matchesMouse(click)) {
                              return;
                          }

                          long now = System.currentTimeMillis();
                          if (now - lastActivationTimeMs < DEBOUNCE_MS) {
                              return;
                          }
                          lastActivationTimeMs = now;

                          TotemSwapHandler.trySwapTotem(client, inventoryScreen);
                      });
                  });

                  LOGGER.info("INV Totem Bind (1.21.11) initialized. Credit: Ahmad");
              }

              public static KeyBinding getSwapTotemKeyBinding() {
                  return swapTotemKeyBinding;
              }
          }
          EOF

          cat << 'EOF' > src/main/java/com/ahmad/invtotembind/util/TotemSwapHandler.java
          package com.ahmad.invtotembind.util;

          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.gui.screen.ingame.InventoryScreen;
          import net.minecraft.client.network.ClientPlayerEntity;
          import net.minecraft.client.network.ClientPlayerInteractionManager;
          import net.minecraft.item.ItemStack;
          import net.minecraft.item.Items;
          import net.minecraft.screen.PlayerScreenHandler;
          import net.minecraft.screen.slot.Slot;
          import net.minecraft.screen.slot.SlotActionType;
          import net.minecraft.text.Text;
          import net.minecraft.util.Formatting;

          public final class TotemSwapHandler {

              private static final Text MSG_ALREADY_EQUIPPED = Text.translatable("text.inv_totem_bind.totem_already_equipped")
                      .formatted(Formatting.YELLOW);
              private static final Text MSG_NO_TOTEM_FOUND = Text.translatable("text.inv_totem_bind.no_totem_found")
                      .formatted(Formatting.RED);

              private static final int OFFHAND_SWAP_BUTTON = 40;

              private TotemSwapHandler() {
              }

              public static void trySwapTotem(MinecraftClient client, InventoryScreen screen) {
                  if (client == null || screen == null || client.currentScreen != screen) {
                      return;
                  }

                  ClientPlayerEntity player = client.player;
                  ClientPlayerInteractionManager interactionManager = client.interactionManager;
                  if (player == null || client.world == null || interactionManager == null) {
                      return;
                  }

                  if (player.isSpectator() || player.isDead()) {
                      return;
                  }

                  PlayerScreenHandler handler = screen.getScreenHandler();
                  if (handler == null || player.currentScreenHandler != handler) {
                      return;
                  }

                  if (!handler.getCursorStack().isEmpty()) {
                      return;
                  }

                  if (PlayerScreenHandler.OFFHAND_ID >= handler.slots.size()) {
                      return;
                  }

                  Slot offhandSlot = handler.getSlot(PlayerScreenHandler.OFFHAND_ID);
                  if (offhandSlot == null) {
                      return;
                  }

                  ItemStack offhandStack = offhandSlot.getStack();
                  if (offhandStack.isOf(Items.TOTEM_OF_UNDYING)) {
                      player.sendMessage(MSG_ALREADY_EQUIPPED, true);
                      return;
                  }

                  int totemSlotId = findTotemSlotId(handler);
                  if (totemSlotId == -1) {
                      player.sendMessage(MSG_NO_TOTEM_FOUND, true);
                      return;
                  }

                  Slot sourceSlot = handler.getSlot(totemSlotId);
                  if (sourceSlot == null || !sourceSlot.hasStack() || !sourceSlot.canTakeItems(player)) {
                      return;
                  }

                  interactionManager.clickSlot(
                          handler.syncId,
                          totemSlotId,
                          OFFHAND_SWAP_BUTTON,
                          SlotActionType.SWAP,
                          player
                  );

                  if (!offhandSlot.getStack().isOf(Items.TOTEM_OF_UNDYING)
                          && sourceSlot.getStack().isOf(Items.TOTEM_OF_UNDYING)
                          && handler.getCursorStack().isEmpty()) {
                      boolean hadOffhandItem = !offhandSlot.getStack().isEmpty();
                      interactionManager.clickSlot(handler.syncId, totemSlotId, 0, SlotActionType.PICKUP, player);
                      interactionManager.clickSlot(handler.syncId, PlayerScreenHandler.OFFHAND_ID, 0, SlotActionType.PICKUP, player);
                      if (hadOffhandItem && !handler.getCursorStack().isEmpty()) {
                          interactionManager.clickSlot(handler.syncId, totemSlotId, 0, SlotActionType.PICKUP, player);
                      }
                  }
              }

              private static int findTotemSlotId(PlayerScreenHandler handler) {
                  int slotCount = handler.slots.size();

                  int hotbarEnd = Math.min(PlayerScreenHandler.HOTBAR_END, slotCount);
                  for (int i = PlayerScreenHandler.HOTBAR_START; i < hotbarEnd; i++) {
                      Slot slot = handler.getSlot(i);
                      if (slot != null && slot.getStack().isOf(Items.TOTEM_OF_UNDYING)) {
                          return i;
                      }
                  }

                  int invEnd = Math.min(PlayerScreenHandler.INVENTORY_END, slotCount);
                  for (int i = PlayerScreenHandler.INVENTORY_START; i < invEnd; i++) {
                      Slot slot = handler.getSlot(i);
                      if (slot != null && slot.getStack().isOf(Items.TOTEM_OF_UNDYING)) {
                          return i;
                      }
                  }

                  return -1;
              }
          }
          EOF

          cat << 'EOF' > src/main/java/com/ahmad/invtotembind/config/InvTotemConfig.java
          package com.ahmad.invtotembind.config;

          import com.ahmad.invtotembind.InvTotemBindClient;
          import net.fabricmc.loader.api.FabricLoader;

          import java.io.IOException;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.nio.file.Files;
          import java.nio.file.Path;
          import java.util.Properties;

          public final class InvTotemConfig {
              private static final String CONFIG_FILE_NAME = "inv_totem_bind.properties";
              private static final String KEY_ENABLED = "enabled";

              private static boolean enabled = true;

              private InvTotemConfig() {
              }

              public static boolean isEnabled() {
                  return enabled;
              }

              public static void setEnabled(boolean value) {
                  enabled = value;
                  save();
              }

              public static void toggleEnabled() {
                  setEnabled(!enabled);
              }

              private static Path getConfigPath() {
                  return FabricLoader.getInstance().getConfigDir().resolve(CONFIG_FILE_NAME);
              }

              public static void load() {
                  Path path = getConfigPath();
                  if (!Files.exists(path)) {
                      enabled = true;
                      save();
                      return;
                  }

                  Properties props = new Properties();
                  try (InputStream in = Files.newInputStream(path)) {
                      props.load(in);
                      String rawEnabled = props.getProperty(KEY_ENABLED);
                      if (rawEnabled == null) {
                          enabled = true;
                      } else {
                          String trimmed = rawEnabled.trim();
                          enabled = !"false".equalsIgnoreCase(trimmed);
                      }
                  } catch (IOException | IllegalArgumentException e) {
                      InvTotemBindClient.LOGGER.warn("Failed to read {}; using default settings.", CONFIG_FILE_NAME, e);
                      enabled = true;
                  }
              }

              public static void save() {
                  Path path = getConfigPath();
                  Properties props = new Properties();
                  props.setProperty(KEY_ENABLED, Boolean.toString(enabled));

                  try {
                      Files.createDirectories(path.getParent());
                      try (OutputStream out = Files.newOutputStream(path)) {
                          props.store(out, "INV Totem Bind Configuration (Minecraft 1.21.11) - Credit: Ahmad");
                      }
                  } catch (IOException e) {
                      InvTotemBindClient.LOGGER.warn("Failed to save {}.", CONFIG_FILE_NAME, e);
                  }
              }
          }
          EOF

          cat << 'EOF' > src/main/java/com/ahmad/invtotembind/config/InvTotemConfigScreen.java
          package com.ahmad.invtotembind.config;

          import com.ahmad.invtotembind.InvTotemBindClient;
          import net.minecraft.client.gui.DrawContext;
          import net.minecraft.client.gui.screen.Screen;
          import net.minecraft.client.gui.screen.option.KeybindsScreen;
          import net.minecraft.client.gui.widget.ButtonWidget;
          import net.minecraft.client.option.KeyBinding;
          import net.minecraft.screen.ScreenTexts;
          import net.minecraft.text.Text;
          import net.minecraft.util.Formatting;

          public final class InvTotemConfigScreen extends Screen {
              private final Screen parent;

              public InvTotemConfigScreen(Screen parent) {
                  super(Text.translatable("screen.inv_totem_bind.config.title"));
                  this.parent = parent;
              }

              @Override
              protected void init() {
                  int buttonWidth = 210;
                  int buttonHeight = 20;
                  int centerX = this.width / 2 - buttonWidth / 2;
                  int startY = this.height / 2 - 30;

                  this.addDrawableChild(ButtonWidget.builder(getToggleText(), button -> {
                      InvTotemConfig.toggleEnabled();
                      button.setMessage(getToggleText());
                  }).dimensions(centerX, startY, buttonWidth, buttonHeight).build());

                  this.addDrawableChild(ButtonWidget.builder(
                          Text.translatable("screen.inv_totem_bind.config.open_controls"),
                          button -> {
                              if (this.client != null) {
                                  this.client.setScreen(new KeybindsScreen(this, this.client.options));
                              }
                          }
                  ).dimensions(centerX, startY + 28, buttonWidth, buttonHeight).build());

                  this.addDrawableChild(ButtonWidget.builder(ScreenTexts.DONE, button -> close())
                          .dimensions(centerX, startY + 68, buttonWidth, buttonHeight)
                          .build());
              }

              private static Text getToggleText() {
                  if (InvTotemConfig.isEnabled()) {
                      return Text.translatable("screen.inv_totem_bind.config.enabled").formatted(Formatting.GREEN);
                  }
                  return Text.translatable("screen.inv_totem_bind.config.disabled").formatted(Formatting.RED);
              }

              @Override
              public void render(DrawContext context, int mouseX, int mouseY, float delta) {
                  super.render(context, mouseX, mouseY, delta);

                  int centerX = this.width / 2;
                  int titleY = this.height / 2 - 70;

                  context.drawCenteredTextWithShadow(this.textRenderer, this.title, centerX, titleY, 0xFFFFFF);

                  KeyBinding keyBinding = InvTotemBindClient.getSwapTotemKeyBinding();
                  Text boundKeyName = keyBinding != null
                          ? keyBinding.getBoundKeyLocalizedText().copy().formatted(Formatting.AQUA)
                          : Text.literal("R").formatted(Formatting.AQUA);

                  Text keybindInfo = Text.translatable("screen.inv_totem_bind.config.keybind_info", boundKeyName)
                          .formatted(Formatting.GRAY);
                  Text keybindHint = Text.translatable("screen.inv_totem_bind.config.keybind_hint")
                          .formatted(Formatting.DARK_GRAY);
                  Text creditText = Text.translatable("screen.inv_totem_bind.config.credit")
                          .formatted(Formatting.DARK_GRAY);

                  context.drawCenteredTextWithShadow(this.textRenderer, keybindInfo, centerX, this.height / 2 - 52, 0xA0A0A0);
                  context.drawCenteredTextWithShadow(this.textRenderer, keybindHint, centerX, this.height / 2 + 24, 0x808080);
                  context.drawCenteredTextWithShadow(this.textRenderer, creditText, centerX, this.height - 18, 0x606060);
              }

              @Override
              public void close() {
                  InvTotemConfig.save();
                  if (this.client != null) {
                      this.client.setScreen(this.parent);
                  }
              }
          }
          EOF

          cat << 'EOF' > src/main/java/com/ahmad/invtotembind/config/ModMenuIntegration.java
          package com.ahmad.invtotembind.config;

          import com.terraformersmc.modmenu.api.ConfigScreenFactory;
          import com.terraformersmc.modmenu.api.ModMenuApi;

          public final class ModMenuIntegration implements ModMenuApi {
              @Override
              public ConfigScreenFactory<?> getModConfigScreenFactory() {
                  return InvTotemConfigScreen::new;
              }
          }
          EOF

          # Remove leading spaces added by YAML block
          for f in settings.gradle gradle.properties build.gradle src/main/resources/fabric.mod.json src/main/resources/assets/inv_totem_bind/lang/en_us.json $(find src -name "*.java"); do
            sed -i 's/^          //' "$f"
          done

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build Mod with Gradle
        run: gradle build

      - name: Upload Compiled Mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: inv-totem-bind-1.21.11-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar